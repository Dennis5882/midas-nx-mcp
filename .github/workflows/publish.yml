name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    if: startsWith(github.event.release.tag_name, 'v')
    # Everything that can fail must fail here, before the publish job runs:
    # once a version is on PyPI it cannot be replaced, only yanked.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: pytest

      - name: Fail if the release tag does not match midas_nx_mcp.__version__
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG#v}"
          pkg="$(python -c 'import midas_nx_mcp; print(midas_nx_mcp.__version__)')"
          if [ "$tag" != "$pkg" ]; then
            echo "Release tag ${RELEASE_TAG} does not match __version__ ${pkg}" >&2
            exit 1
          fi

      - run: python -m build
      - run: twine check dist/*

      - name: Install the wheel into a clean venv and start it over stdio
        run: |
          set -euxo pipefail
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          cp scripts/wheel_smoke_test.py /tmp/wheel_smoke_test.py
          cd /
          /tmp/smoke/bin/python /tmp/wheel_smoke_test.py

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    if: startsWith(github.event.release.tag_name, 'v')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      # Tracked by branch, not pinned: PyPA ships Trusted Publishing / OIDC
      # fixes on release/v1 and recommends following it.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
