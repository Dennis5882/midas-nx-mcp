[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "midas-nx-mcp"
version = "0.1.0"
description = "Local MCP server for MIDAS Gen NX / Civil NX, built on midas-nx"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=2.3,<3",
    "midas-nx>=2.10.6",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/midas_nx_mcp"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
